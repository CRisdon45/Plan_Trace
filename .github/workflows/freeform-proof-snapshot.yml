name: Freeform proof source evidence
on:
  push:
    branches: [research/freeform-tangent-kotlin]
    paths: ['.github/workflows/freeform-proof-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive committed source for the isolated proof
        shell: bash
        run: |
          mkdir snapshot
          git archive --format=tar HEAD app/src app/build.gradle.kts app/proguard-rules.pro gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties .github README.md AGENTS.md docs tools metadata.json .gitignore > snapshot/source.tar
          git rev-parse HEAD > snapshot/REVISION.txt
          sha256sum snapshot/source.tar > snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeform-source-${{ github.sha }}
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
# No client input, private reference images, credentials, device state or APKs.
# Scoped to this research branch only; does not change application behavior.
