name: Tablet + Filament Integration

on:
  push:
    branches:
      - feature/tablet-filament-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-filament-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sdkmanager 'platforms;android-36.1' || true

      - name: Restore stable development signing identity
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: plan-trace-development-signing-v1

      - name: Prepare development signing identity
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Plan Trace Development,O=Development,C=US'
          fi

      - name: Unit regressions and instrumentation APKs
        shell: bash
        run: >-
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          --stacktrace --console=plain

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot tablet emulator and exercise integrated app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: sh .github/scripts/run_emulator_smoke.sh

      - name: Preserve stable development signing identity
        if: success()
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: plan-trace-development-signing-v1

      - name: Upload exact tested integrated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plan-trace-tablet-filament-integrated
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-trace-tablet-filament-evidence
          path: |
            smoke-artifacts/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
