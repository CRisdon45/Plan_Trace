name: Android 2D integrity

on:
  push:
    branches: [research/freeform-tangent-kotlin, feat/project-geometry-seam, feat/expert-workspace-ui, feat/off-tablet-integrity, feat/2d-foundation-northstar]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'tools/qa/check_local_runtime.py'
      - 'tools/qa/test_local_runtime_policy.py'
      - '.github/workflows/android-2d-integrity.yml'
  pull_request:
    branches: [main, feat/2d-foundation-northstar, feat/off-tablet-integrity]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'tools/qa/check_local_runtime.py'
      - 'tools/qa/test_local_runtime_policy.py'
      - '.github/workflows/android-2d-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-2d-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the compile SDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Ignore yes's SIGPIPE, not sdkmanager failures.
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Create an ephemeral CI debug key
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Plan Trace CI,OU=Development,O=Plan Trace,C=US' \
            -keyalg RSA -keysize 2048 -validity 2
          echo 'This ephemeral CI key must not replace a locally installed development app key.' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit the shipped runtime, not only declared dependencies
        shell: bash
        run: |
          python3 -m unittest discover -s tools/qa -p 'test_local_runtime_policy.py' -v
          ./gradlew --no-daemon --no-configuration-cache --console=plain :app:reportRuntimeDependencies :app:processDebugMainManifest :app:processReleaseMainManifest
          python3 tools/qa/check_local_runtime.py --build-dir app/build
      - name: Unit tests and debug assembly
        shell: bash
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Summarize actual test evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          files = sorted(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          lines = ['## Automated evidence', 'Source: `' + os.environ['GITHUB_SHA'] + '`']
          for file in files:
              root = ET.parse(file).getroot()
              counts = {key: int(root.attrib.get(key, '0')) for key in totals}
              for key, value in counts.items():
                  totals[key] += value
              lines.append(f"- {root.attrib.get('name', file.stem)}: {counts}")
          lines.append(f'Totals: {totals}' if files else 'No test-result XML was produced. This is not a passing test run.')
          lines.append('Physical S Pen, tablet usability and visual acceptance: NOT RUN.')
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(text)
          PY
      - name: Retain synthetic test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/design-geometry/
            app/build/reports/runtime-policy/
          if-no-files-found: warn
          retention-days: 7
      # No installation, release signing, deployment, private fixtures or APK upload.
