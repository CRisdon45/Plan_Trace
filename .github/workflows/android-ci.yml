name: Android CI

on:
  push:
    branches:
      - feature/tablet-input-filament-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          sdkmanager 'platforms;android-36.1' || true

      - name: Restore stable development signing identity
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: plan-trace-development-signing-v1

      - name: Prepare development signing identity
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Plan Trace Development,O=Development,C=US'
          fi

      - name: Compile and package debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Preserve stable development signing identity
        if: success()
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: plan-trace-development-signing-v1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plan-trace-tablet-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
