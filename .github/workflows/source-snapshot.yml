name: Public source snapshot
on:
  workflow_dispatch:
  push:
    branches: [feat/project-geometry-seam]
    paths: ['.github/workflows/source-snapshot.yml', 'docs/CURRENT_STATE.md']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive committed source only
        shell: bash
        run: |
          mkdir snapshot
          git archive --format=tar HEAD app/src app/build.gradle.kts app/proguard-rules.pro gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties .github README.md AGENTS.md docs tools metadata.json .gitignore > snapshot/source.tar
          git rev-parse HEAD > snapshot/REVISION.txt
          sha256sum snapshot/source.tar > snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-${{ github.sha }}
          path: snapshot/
          retention-days: 1
          if-no-files-found: error
# Public tracked source only: no .git credentials, local files, SDK, build cache,
# signing keys, runtime data, client attachments, release or deployment.
